<header class="page-head"><h1>解謎字卡</h1><p class="page-head__sub">點卡片翻面。快速複習題型、鎖具與術語。</p></header><p class="result-count">點任一張卡片翻面。</p><div class="flash-grid"><button class="flash" type="button" data-item="" data-i="0" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">密碼破譯</span><span class="flash__face flash__back">用對照表把符號譯回文字:摩斯、凱撒、豬圈、顏色密碼。</span></span></button><button class="flash" type="button" data-item="" data-i="1" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">搜索題</span><span class="flash__face flash__back">有系統地翻遍場景,找出藏起來的鑰匙、紙條與道具。</span></span></button><button class="flash" type="button" data-item="" data-i="2" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">方向鎖</span><span class="flash__face flash__back">靠上下左右的序列開鎖,常 8–10 步。</span></span></button><button class="flash" type="button" data-item="" data-i="3" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">數字密碼鎖</span><span class="flash__face flash__back">3–4 輪 0–9 數字,密室最基本款。</span></span></button><button class="flash" type="button" data-item="" data-i="4" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">電磁鎖</span><span class="flash__face flash__back">電磁鐵吸住門,輸入正確就斷電釋放。沒有鎖舌。</span></span></button><button class="flash" type="button" data-item="" data-i="5" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">密碼筒</span><span class="flash__face flash__back">圓筒上 5–6 個字母環,轉出單字才能抽出內芯。</span></span></button><button class="flash" type="button" data-item="" data-i="6" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">UV 紫外線線索</span><span class="flash__face flash__back">不是鎖——顯現隱形墨水線索,再去開真正的鎖。</span></span></button><button class="flash" type="button" data-item="" data-i="7" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">控場 GM</span><span class="flash__face flash__back">負責規則、監看、提示與安全的工作人員。</span></span></button><button class="flash" type="button" data-item="" data-i="8" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">NPC</span><span class="flash__face flash__back">工作人員扮演、互動推進劇情的角色。</span></span></button><button class="flash" type="button" data-item="" data-i="9" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">誤導線索</span><span class="flash__face flash__back">不通往答案、只會浪費時間的假線索。</span></span></button><button class="flash" type="button" data-item="" data-i="10" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">終局謎題</span><span class="flash__face flash__back">把前面謎題結果匯整成最後一道大謎題。</span></span></button><button class="flash" type="button" data-item="" data-i="11" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">暴力破解</span><span class="flash__face flash__back">把某一位的所有可能逐一試——只差一碼時好用。</span></span></button><button class="flash" type="button" data-item="" data-i="12" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">線性 vs 非線性</span><span class="flash__face flash__back">固定一題接一題,對上多題可並行解。</span></span></button><button class="flash" type="button" data-item="" data-i="13" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">暗格</span><span class="flash__face flash__back">藏線索或鑰匙的假底/偽裝物件。</span></span></button><button class="flash" type="button" data-item="" data-i="14" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">小天使</span><span class="flash__face flash__back">台灣對帶場 GM 的暱稱,負責引導與提示。</span></span></button><button class="flash" type="button" data-item="" data-i="15" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">多階段嵌套</span><span class="flash__face flash__back">一題答案是下一題鑰匙——多數密室的骨架。</span></span></button></di
