<header class="page-head"><h1>Flashcards</h1><p class="page-head__sub">Tap a card to flip. Quick recall for puzzle types, locks and lingo.</p></header><p class="result-count">Tap any card to flip.</p><div class="flash-grid"><button class="flash" type="button" data-item="" data-i="0" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">Cipher decoding</span><span class="flash__face flash__back">Translate symbols back to text with a key: Morse, Caesar, Pigpen, color codes.</span></span></button><button class="flash" type="button" data-item="" data-i="1" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">Search puzzle</span><span class="flash__face flash__back">Systematically comb the room for hidden keys, notes and props.</span></span></button><button class="flash" type="button" data-item="" data-i="2" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">Directional lock</span><span class="flash__face flash__back">Opens with an up/down/left/right sequence, often 8–10 steps.</span></span></button><button class="flash" type="button" data-item="" data-i="3" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">Number combination lock</span><span class="flash__face flash__back">3–4 wheels of 0–9; the most basic escape-room lock.</span></span></button><button class="flash" type="button" data-item="" data-i="4" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">Maglock</span><span class="flash__face flash__back">Electromagnet holds the door; correct input cuts power to release. No bolt.</span></span></button><button class="flash" type="button" data-item="" data-i="5" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">Cryptex</span><span class="flash__face flash__back">Cylinder with 5–6 letter rings; spell the word to slide out the core.</span></span></button><button class="flash" type="button" data-item="" data-i="6" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">UV / blacklight clue</span><span class="flash__face flash__back">Not a lock — reveals invisible-ink clues that feed a real lock.</span></span></button><button class="flash" type="button" data-item="" data-i="7" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">Game Master (GM)</span><span class="flash__face flash__back">Staff who run the game: rules, monitoring, hints and safety.</span></span></button><button class="flash" type="button" data-item="" data-i="8" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">NPC</span><span class="flash__face flash__back">A character played by staff who interacts to push the story.</span></span></button><button class="flash" type="button" data-item="" data-i="9" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">Red herring</span><span class="flash__face flash__back">A fake clue that leads nowhere and wastes your time.</span></span></button><button class="flash" type="button" data-item="" data-i="10" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">Meta / final puzzle</span><span class="flash__face flash__back">Combines the results of earlier puzzles into the last big one.</span></span></button><button class="flash" type="button" data-item="" data-i="11" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">Brute force</span><span class="flash__face flash__back">Try every possibility of one digit — handy when one short.</span></span></button><button class="flash" type="button" data-item="" data-i="12" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">Linear vs non-linear</span><span class="flash__face flash__back">Fixed one-by-one order vs many puzzles solvable in parallel.</span></span></button><button class="flash" type="button" data-item="" data-i="13" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">Hidden compartment</span><span class="flash__face flash__back">A false bottom or disguised object hiding clues or keys.</span></span></button><button class="flash" type="button" data-item="" data-i="14" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">Little Angel</span><span class="flash__face flash__back">Taiwan nickname for the host/GM who guides and hints.</span></span></button><button class="flash" type="button" data-item="" data-i="15" aria-pressed="false"><span class="flash__inner"><span class="flash__face flash__front">Multi-step nested puzzle</span><span class="flash__face flash__back">Each answer is the key to the next — the skeleton of most rooms.</span></span></button></div>
